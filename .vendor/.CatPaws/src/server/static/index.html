<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CatPaws 控制面板 (WDA)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 540px;
            margin: 40px auto;
            padding: 0 16px;
        }
        h2 { margin-bottom: 4px; }
        .section { margin: 18px 0; padding: 14px; background: #f8f8f8; border-radius: 8px; }
        .section h3 { margin-top: 0; }
        label { font-size: 14px; color: #444; }
        input[type=text], input[type=number] {
            padding: 8px 10px; font-size: 16px; width: 140px;
            border: 1px solid #ccc; border-radius: 4px;
        }
        select, button {
            padding: 8px 12px; font-size: 15px; margin: 6px 4px 6px 0;
            border: 1px solid #ccc; border-radius: 4px; cursor: pointer;
        }
        button.primary { background: #2196F3; color: #fff; border: none; }
        button.success { background: #4CAF50; color: #fff; border: none; }
        button.danger  { background: #f44336; color: #fff; border: none; }
        button:disabled { opacity: .5; cursor: default; }
        .badge {
            display: inline-block; padding: 4px 12px; border-radius: 20px;
            font-size: 14px; margin-left: 8px;
        }
        .badge.on  { background: #d4edda; color: #155724; }
        .badge.off { background: #f8d7da; color: #721c24; }
        #log {
            background: #1e1e1e; color: #cfcfcf; padding: 10px;
            height: 200px; overflow-y: auto; border-radius: 6px;
            font-family: monospace; font-size: 13px;
        }
    </style>
</head>
<body>
    <h2>🐾 CatPaws 控制面板 (WDA)</h2>
    <p style="color:#666;font-size:13px;">通过 WDA 原生接口控制 iOS 设备</p>

    <!-- 配置区 -->
    <div class="section">
        <h3>📱 手机配置</h3>
        <label>手机 IP：</label>
        <input type="text" id="phoneIp" placeholder="例如 192.168.1.100" value="127.0.0.1">
        <label style="margin-left:10px;">端口：</label>
        <input type="number" id="wdaPort" placeholder="8100" value="8100" style="width:80px;">
        <br>
        <button id="initBtn" class="primary">🔌 初始化连接</button>
        <span id="statusBadge" class="badge off">未连接</span>
    </div>

    <!-- 动作区 -->
    <div class="section">
        <h3>🎮 动作脚本</h3>
        <label for="actionSelect">选择脚本：</label><br>
        <select id="actionSelect"><option>-- 加载中 --</option></select>
        <br>
        <button id="runBtn" class="success" disabled>▶ 开始运行</button>
        <button id="stopBtn" class="danger" disabled>⏹ 停止</button>
        <button id="refreshBtn">🔄 刷新列表</button>
        <div id="runningStatus" style="margin-top:10px;font-size:14px;color:#666;"></div>
    </div>

    <!-- 日志 -->
    <div class="section">
        <h3>📋 日志</h3>
        <div id="log"></div>
    </div>

    <script>
        const phoneIpInput  = document.getElementById('phoneIp');
        const wdaPortInput  = document.getElementById('wdaPort');
        const initBtn       = document.getElementById('initBtn');
        const statusBadge   = document.getElementById('statusBadge');
        const select       = document.getElementById('actionSelect');
        const runBtn       = document.getElementById('runBtn');
        const stopBtn      = document.getElementById('stopBtn');
        const refreshBtn   = document.getElementById('refreshBtn');
        const runningStatusDiv = document.getElementById('runningStatus');
        const logDiv       = document.getElementById('log');

        function log(msg) {
            const div = document.createElement('div');
            div.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            logDiv.appendChild(div);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        // ---- 状态轮询 ----
        async function pollStatus() {
            try {
                const resp = await fetch('/api/status');
                const data = await resp.json();
                const initialized = data.initialized;
                const connected = data.connected;
                if (connected) {
                    statusBadge.textContent = '✅ WDA 已连接';
                    statusBadge.className = 'badge on';
                } else if (initialized) {
                    statusBadge.textContent = '⚠️ WDA 已初始化(不可达)';
                    statusBadge.className = 'badge off';
                } else {
                    statusBadge.textContent = '未连接';
                    statusBadge.className = 'badge off';
                }
                initBtn.disabled = initialized;
                
                // 检查是否有脚本在运行
                const runningResp = await fetch('/api/running_actions');
                const runningData = await runningResp.json();
                const runningActions = runningData.actions || [];
                
                if (runningActions.length > 0) {
                    runningStatusDiv.innerHTML = `<strong>🔴 正在运行:</strong> ${runningActions.join(', ')}`;
                    stopBtn.disabled = false;
                    runBtn.disabled = true;  // 有脚本运行时禁用启动按钮
                } else {
                    runningStatusDiv.innerHTML = '';
                    stopBtn.disabled = true;
                    runBtn.disabled = !initialized || select.value.startsWith('--');
                }
            } catch (e) { /* ignore */ }
        }
        setInterval(pollStatus, 2000);
        pollStatus();

        // ---- 初始化 HTTP 发送器 ----
        initBtn.onclick = async () => {
            const ip = phoneIpInput.value.trim();
            const port = parseInt(wdaPortInput.value) || 8100;
            if (!ip) { log('请输入手机 IP'); return; }
            
            log(`正在连接 WDA → ${ip}:${port} ...`);
            try {
                const resp = await fetch('/api/init_sender', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({phone_ip: ip, port: port})
                });
                const data = await resp.json();
                if (data.error) {
                    log(`初始化失败: ${data.error}`);
                } else {
                    log(data.message);
                    pollStatus();
                }
            } catch (e) { log(`请求失败: ${e}`); }
        };

        // ---- 动作列表 ----
        async function requestActionList() {
            try {
                const resp = await fetch('/api/actions');
                const data = await resp.json();
                populateList(data.actions || []);
            } catch (e) { log('获取动作列表失败'); }
        }

        function populateList(actions) {
            select.innerHTML = '';
            if (!actions.length) {
                select.innerHTML = '<option>-- 无可用脚本 --</option>';
                runBtn.disabled = true;
                return;
            }
            actions.forEach(name => {
                const opt = document.createElement('option');
                opt.value = opt.textContent = name;
                select.appendChild(opt);
            });
            // 触发一次状态更新，根据 initialized 状态决定按钮
            pollStatus();
        }

        refreshBtn.onclick = requestActionList;

        // ---- 运行动作 ----
        runBtn.onclick = async () => {
            const name = select.value;
            if (!name || name.startsWith('--')) return;
            
            log(`▶ 启动脚本: ${name}`);
            try {
                const resp = await fetch('/api/run_action', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({name: name})
                });
                const data = await resp.json();
                if (data.error) { 
                    log(`错误: ${data.error}`); 
                } else { 
                    log(`✅ 脚本 "${name}" 已启动`); 
                    setTimeout(pollStatus, 500);  // 立即更新状态
                }
            } catch (e) { log(`请求失败: ${e}`); }
        };

        // ---- 停止动作 ----
        stopBtn.onclick = async () => {
            // 获取当前运行的脚本名称
            try {
                const runningResp = await fetch('/api/running_actions');
                const runningData = await runningResp.json();
                const runningActions = runningData.actions || [];
                
                if (runningActions.length === 0) {
                    log('⚠️ 没有正在运行的脚本');
                    return;
                }
                
                // 停止第一个运行的脚本（通常只有一个）
                const name = runningActions[0];
                log(`⏹ 正在停止脚本: ${name}...`);
                
                const resp = await fetch('/api/stop_action', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({name: name})
                });
                const data = await resp.json();
                
                if (data.error) {
                    log(`❌ 停止失败: ${data.error}`);
                } else {
                    log(`✅ ${data.message}`);
                    setTimeout(pollStatus, 500);  // 立即更新状态
                }
            } catch (e) { log(`请求失败: ${e}`); }
        };

        // 初始加载
        requestActionList();
    </script>
</body>
</html>
