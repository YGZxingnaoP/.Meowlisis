<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>喵呜 · 手机端</title>
  <link rel="stylesheet" href="/static/css/phone.css">
</head>
<body>
  <video id="cam" playsinline webkit-playsinline autoplay muted></video>
  <canvas id="camView"></canvas>

  <div id="petLayer">
    <iframe id="petFrame" src="/pet/renderer/index.html?autofit=1&fit=0.13" title="桌宠"></iframe>
  </div>

  <div id="bubble" class="bubble hidden"></div>

  <input id="volRange" class="volrange" type="range" min="0" max="100" value="100"
         title="语音音量">

  <button id="flipBtn" class="flip" title="切换前后摄像头" aria-label="切换前后摄像头">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
         stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 11a8 8 0 0 0-13.7-5.3L4 8"></path>
      <path d="M4 4v4h4"></path>
      <path d="M4 13a8 8 0 0 0 13.7 5.3L20 16"></path>
      <path d="M20 20v-4h-4"></path>
    </svg>
  </button>

  <button id="modePill" class="mode-pill" title="聊天=只听手机自己的对话 · 通话=听全部语音">聊天</button>
  <div id="modeToast" class="mode-toast hidden"></div>

  <div id="nameTag" class="chip" title="点一下改编号">
    <div class="chip-line">
      <span id="nameValue" class="chip-value">未设置</span>
      <input id="nameInput" class="chip-input" type="text" maxlength="12" inputmode="numeric"
             autocomplete="off" placeholder="输入编号，如 000001">
    </div>
    <div id="nickValue" class="chip-nick"></div>
  </div>

  <div id="inputBar" class="inputbar hidden">
    <input id="textInput" type="text" placeholder="输入消息…" autocomplete="off">
    <button id="sendBtn" class="send">发送</button>
  </div>

  <div id="sayLine" class="say-line hidden"></div>

  <div id="dock" class="dock">
    <button id="camBtn" class="ball" type="button" title="摄像头" aria-label="摄像头">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 8.6A2.6 2.6 0 0 1 5.6 6h1.6l1.2-1.9h7.2L16.8 6h1.6A2.6 2.6 0 0 1 21 8.6v7.8A2.6 2.6 0 0 1 18.4 19H5.6A2.6 2.6 0 0 1 3 16.4z"></path>
        <circle cx="12" cy="12.4" r="3.3"></circle>
      </svg>
    </button>
    <button id="micBtn" class="ball" type="button" title="麦克风" aria-label="麦克风">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
           stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="3" width="6" height="11" rx="3"></rect>
        <path d="M5.6 11.4a6.4 6.4 0 0 0 12.8 0"></path>
        <path d="M12 17.8V21"></path>
      </svg>
    </button>
    <button id="msgBtn" class="ball" type="button" title="消息" aria-label="消息">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 12.4c0 3.5-3.6 6.4-8 6.4a9.7 9.7 0 0 1-2.7-.4L5 20.4l1.2-2.8A6.5 6.5 0 0 1 4 12.4C4 8.9 7.6 6 12 6s8 2.9 8 6.4z"></path>
      </svg>
    </button>
    <button id="volBtn" class="ball vol" type="button" title="语音音量：点击静音/恢复" aria-label="语音音量">
      <svg class="i-sound" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 9.4h3L11.4 6v12L7 14.6H4z"></path>
        <path d="M15.4 9.3a4 4 0 0 1 0 5.4"></path>
        <path d="M18 7a7.6 7.6 0 0 1 0 10"></path>
      </svg>
      <svg class="i-mute" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 9.4h3L11.4 6v12L7 14.6H4z"></path>
        <path d="M16 9.8l4.6 4.6"></path>
        <path d="M20.6 9.8L16 14.4"></path>
      </svg>
    </button>
  </div>

  <audio id="phoneAudio" playsinline style="display:none"></audio>

  <script type="module" src="/static/js/main.js"></script>
</body>
</html>
