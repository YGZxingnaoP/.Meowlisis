<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>语音识别字幕（ASR）</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            margin: 0; min-height: 100vh; background: transparent;
            display: flex; justify-content: center; align-items: center;
            font-family: 'Segoe UI', 'Quicksand', 'Poppins', 'Microsoft YaHei', 'PingFang SC', sans-serif;
            position: relative; overflow: hidden;
        }
        .subtitle-box {
            position: relative; background: #ffffff; border-radius: 60px;
            padding: 10px 48px; border: 2px solid #A6C8FF;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.08), 0 4px 12px rgba(100, 150, 255, 0.18);
            transition: all 0.2s ease; max-width: 92vw; min-width: 360px;
            width: fit-content; text-align: center;
        }
        .asr-tag {
            position: absolute; top: -10px; left: 26px; background: #4A90E2;
            color: #fff; font-size: 12px; font-weight: 700; padding: 1px 12px;
            border-radius: 999px; letter-spacing: 1px; z-index: 9;
        }
        .butterfly-deco {
            position: absolute; left: -56px; top: -56px; width: 128px; height: 128px;
            object-fit: contain; pointer-events: none; z-index: 10;
            filter: drop-shadow(0 6px 12px rgba(120, 170, 255, 0.35));
            transition: transform 0.25s ease;
        }
        .subtitle-box:hover .butterfly-deco { transform: rotate(5deg) scale(1.03); }
        .subtitle-text {
            font-size: 44px; font-weight: 700;
            background: linear-gradient(135deg, #4A90E2, #7FB2FF, #9FC9FF);
            background-clip: text; -webkit-background-clip: text; color: transparent;
            text-shadow: 2px 2px 12px rgba(120, 170, 255, 0.25);
            letter-spacing: 1px; word-break: break-word; line-height: 1.2;
            animation: bounceGlow 0.35s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }
        .subtitle-text.single-line { white-space: nowrap; overflow: hidden; word-break: normal; }
        @keyframes bounceGlow {
            0% { opacity: 0; transform: translateY(18px) scale(0.96); }
            60% { opacity: 0.9; transform: translateY(-3px) scale(1.01); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        @media (max-width: 768px) {
            .subtitle-text { font-size: 32px; }
            .subtitle-box { padding: 8px 32px; min-width: 280px; max-width: 90vw; }
            .butterfly-deco { width: 60px; height: 60px; left: -26px; top: -26px; }
        }
        @media (max-width: 480px) {
            .subtitle-text { font-size: 26px; }
            .subtitle-box { padding: 6px 24px; min-width: 240px; }
            .butterfly-deco { width: 52px; height: 52px; left: -22px; top: -22px; }
        }
    </style>
</head>
<body>
    <div class="subtitle-box">
        <span class="asr-tag" id="tagName">你说</span>
        <img src="bluebutterfly.png" alt="蓝蝶" class="butterfly-deco"
             onerror="this.onerror=null; this.style.opacity='0.7';">
        <div class="subtitle-text" id="asrText">🎤 语音识别待机中 🎤</div>
    </div>
    <script>
        const el = document.getElementById('asrText');
        const tagEl = document.getElementById('tagName');
        const IDLE = '🎤 语音识别待机中 🎤';
        const BASE = 44, MIN = 20;
        let ws = null, retry = 0;
        const MAX_RETRY = 5;

        function idle() {
            el.classList.remove('single-line'); el.style.fontSize = '';
            el.textContent = IDLE;
        }
        function fit() {
            el.classList.add('single-line');
            el.style.fontSize = BASE + 'px';
            let s = BASE;
            while (s > MIN && el.scrollWidth > el.clientWidth) { s -= 1; el.style.fontSize = s + 'px'; }
            if (el.scrollWidth > el.clientWidth) {
                el.classList.remove('single-line');
                el.style.fontSize = MIN + 'px';
            }
        }
        function show(t) {
            el.style.fontSize = '';
            el.textContent = t;
            fit();
            anim();
        }
        function anim() { el.style.animation = 'none'; void el.offsetHeight;
            el.style.animation = 'bounceGlow 0.35s cubic-bezier(0.2, 0.9, 0.4, 1.1)'; }

        function connect() {
            try { if (ws) ws.close(); } catch (e) {}
            try {
                ws = new WebSocket('ws://localhost:8765/?role=asr');
                ws.onopen = function () { retry = 0; };
                ws.onmessage = function (ev) {
                    if (!ev.data || typeof ev.data !== 'string') return;
                    let msg = null;
                    try { msg = JSON.parse(ev.data); } catch (e) { msg = null; }
                    if (msg && msg.r) {
                        if (msg.r === 'clear') { idle(); anim(); return; }
                        if (msg.n && tagEl) { tagEl.textContent = msg.n; }   // 标签=说话用户名
                        const t = String(msg.t || '').trim();
                        if (t === '') idle(); else show(t.replace(/\n+/g, ' '));
                    } else {
                        const raw = String(ev.data).trim();
                        if (raw === '' || raw === '__CLEAR__') idle();
                        else show(raw.replace(/\n+/g, ' '));
                    }
                };
                ws.onerror = function () {
                    setTimeout(function () {
                        if (ws && ws.readyState !== WebSocket.OPEN && !el.innerText.includes('断开')) {
                            show('💔 字幕连接断开 重试中 💔');
                        }
                    }, 500);
                };
                ws.onclose = function () {
                    show('🦋 字幕连接断开 · 正在重连 🦋');
                    if (retry < MAX_RETRY) {
                        retry++;
                        setTimeout(connect, Math.min(2000 * retry, 10000));
                    } else { show('💧 无法连接服务端 请检查程序 💧'); }
                };
            } catch (err) {
                show('⚠️ 初始化连接失败 ⚠️'); retry++;
                if (retry < MAX_RETRY) setTimeout(connect, 2000);
            }
        }
        connect();
        window.addEventListener('beforeunload', function () { if (ws) ws.close(); });
    </script>
</body>
</html>
