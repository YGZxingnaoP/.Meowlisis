<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>桌宠控制面板</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Microsoft YaHei", sans-serif;
      background: #1e1e2e;
      color: #eee;
      padding: 16px;
      font-size: 13px;
    }
    h2 {
      font-size: 15px;
      margin-bottom: 14px;
      color: #ffb3d1;
      font-weight: 600;
    }
    .section {
      background: #2a2a3a;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .section-title {
      font-size: 12px;
      color: #aaa;
      margin-bottom: 10px;
    }
    .row {
      display: flex;
      align-items: center;
      margin-bottom: 10px;
      gap: 8px;
    }
    .row:last-child { margin-bottom: 0; }
    label { width: 72px; flex-shrink: 0; color: #ccc; }
    input[type="range"] {
      flex: 1;
      accent-color: #ff66a5;
    }
    input[type="number"], select {
      background: #1e1e2e;
      color: #eee;
      border: 1px solid #444;
      border-radius: 4px;
      padding: 5px 8px;
      font-size: 13px;
      width: 80px;
      outline: none;
    }
    input[type="number"]:focus, select:focus { border-color: #ff66a5; }
    select { width: 100%; flex: 1; }
    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 6px;
      cursor: pointer;
    }
    .checkbox-row input { accent-color: #ff66a5; }
    .checkbox-row label { width: auto; cursor: pointer; }
    button {
      background: #ff66a5;
      color: #fff;
      border: none;
      border-radius: 5px;
      padding: 6px 14px;
      font-size: 13px;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    button:hover { opacity: 0.85; }
    button.secondary { background: #555; }
    .btn-row { display: flex; gap: 8px; margin-top: 4px; }
    .hint { font-size: 11px; color: #888; margin-top: 6px; }
  </style>
</head>
<body>
  <h2>🐱 喵呜桌宠控制面板</h2>

  <div class="section">
    <div class="section-title">显示</div>
    <div class="row">
      <label>缩放</label>
      <input type="range" id="scaleSlider" min="0.2" max="3" step="0.01" value="1">
      <input type="number" id="scaleInput" min="0.2" max="3" step="0.01" value="1">
    </div>
    <div class="row">
      <label>位置 X</label>
      <input type="number" id="offsetX" step="1" value="0">
      <label style="width:auto;">位置 Y</label>
      <input type="number" id="offsetY" step="1" value="0">
    </div>
    <div class="btn-row">
      <button id="resetPos" class="secondary">位置重置</button>
      <button id="resetScale" class="secondary">缩放重置</button>
      <button id="dragModeBtn">🖱 拖动模式</button>
    </div>
    <div class="hint">开启拖动模式后，可用鼠标直接拖动人物到任意位置，关闭即恢复鼠标穿透。</div>
  </div>

  <div class="section">
    <div class="section-title">模型</div>
    <div class="row">
      <label>Live2D</label>
      <select id="modelSelect"></select>
    </div>
    <div class="hint">扫描 Live2d_resource 下的模型目录</div>
  </div>

  <div class="section">
    <div class="section-title">移动方向修正（左右/上下反了就勾这里）</div>
    <div class="checkbox-row">
      <input type="checkbox" id="swapXY"><label for="swapXY">交换左右 ↔ 上下</label>
    </div>
    <div class="checkbox-row">
      <input type="checkbox" id="flipX"><label for="flipX">左右方向反向</label>
    </div>
    <div class="checkbox-row">
      <input type="checkbox" id="flipY"><label for="flipY">上下方向反向</label>
    </div>
  </div>

  <script src="control.js"></script>
</body>
</html>
