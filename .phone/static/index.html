<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>喵呜 · 手机端</title>
  <link rel="stylesheet" href="/static/css/phone.css">
</head>
<body>
  <video id="cam" playsinline webkit-playsinline autoplay muted></video>
  <canvas id="camView"></canvas>

  <div id="petLayer">
    <iframe id="petFrame" src="/pet/renderer/index.html?autofit=1&fit=0.13" title="桌宠"></iframe>
  </div>

  <div id="bubble" class="bubble hidden"></div>

  <input id="volRange" class="volrange" type="range" min="0" max="100" value="100"
         title="语音音量">

  <button id="flipBtn" class="flip" title="切换前后摄像头">⇄</button>

  <button id="modePill" class="mode-pill" title="聊天=只听手机自己的对话 · 通话=听全部语音">聊天</button>
  <div id="modeToast" class="mode-toast hidden"></div>

  <div id="nameTag" class="chip">
    <span class="chip-label">我是</span>
    <span id="nameValue" class="chip-value">手机用户</span>
    <input id="nameInput" class="chip-input" type="text" maxlength="20" autocomplete="off" placeholder="输入昵称，回车确认">
  </div>

  <div id="inputBar" class="inputbar hidden">
    <input id="textInput" type="text" placeholder="输入消息…" autocomplete="off">
    <button id="sendBtn" class="send">发送</button>
  </div>

  <div id="sayLine" class="say-line hidden"></div>

  <div id="dock" class="dock">
    <button id="camBtn" class="ball" type="button"><span>📷</span></button>
    <button id="micBtn" class="ball" type="button"><span>🎤</span></button>
    <button id="msgBtn" class="ball" type="button"><span>💬</span></button>
    <button id="volBtn" class="ball vol" type="button" title="语音音量：点击静音/恢复"><span>🔊</span></button>
  </div>

  <audio id="phoneAudio" playsinline style="display:none"></audio>

  <script type="module" src="/static/js/main.js"></script>
</body>
</html>
