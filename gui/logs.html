<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>日志中心 · Meowlisis</title>
<link rel="stylesheet" href="css/logs.css?v=20261112a">
</head>
<body>

<div class="lh-app">

    <!-- ==================== 侧边栏：服务 + 启停 ==================== -->
    <aside class="lh-side">
        <div class="lh-brand">
            <span class="lh-brand-dot"></span>
            <span data-i18n="日志中心">日志中心</span>
            <button class="lh-icon-btn" id="btnReload" data-i18n-title="刷新服务列表">⟳</button>
        </div>
        <!-- 语言切换：放进侧边栏，避免悬浮遮挡顶栏的启动/停止按钮 -->
        <div class="lh-lang">
            <div id="langSwitch" class="lang-switch">
                <button type="button" data-lang="zh-CN" class="lang-btn">中文</button>
                <button type="button" data-lang="en" class="lang-btn">EN</button>
            </div>
        </div>
        <div class="lh-side-hint" data-i18n="点服务名看日志 · ▶ 启动 / ■ 停止">点服务名看日志 · ▶ 启动 / ■ 停止</div>
        <nav class="lh-list" id="svcList"><!-- JS 渲染 --></nav>
        <div class="lh-side-foot">
            <label class="lh-switch">
                <input type="checkbox" id="autoScroll" checked>
                <span data-i18n="自动跟随">自动跟随</span>
            </label>
            <span class="lh-ts" id="tsInfo"></span>
        </div>
    </aside>

    <!-- ==================== 主区：日志 ==================== -->
    <main class="lh-main">
        <header class="lh-bar">
            <div class="lh-title">
                <span id="curName">主程序</span>
                <span class="lh-state" id="curState">—</span>
                <span class="lh-file" id="curFile"></span>
            </div>
            <div class="lh-tools">
                <input type="text" id="filter" class="lh-input" placeholder="过滤关键字（支持 | 或）">
                <button class="lh-btn" id="btnRaw" data-i18n="原始日志">原始日志</button>
                <button class="lh-btn" id="btnPause" data-i18n="暂停">暂停</button>
                <button class="lh-btn" id="btnClear" data-i18n="清空">清空</button>
                <button class="lh-btn lh-btn-primary" id="btnStart">▶ <span data-i18n="启动">启动</span></button>
                <button class="lh-btn lh-btn-danger" id="btnStop">■ <span data-i18n="停止">停止</span></button>
            </div>
        </header>

        <!-- 场景页签 + 只看问题：日志主区按"在干什么"分，不按级别分 -->
        <div class="lh-bar2">
            <div class="lh-scenes" id="scenes"><!-- JS 渲染 --></div>
            <button type="button" class="lh-scene" id="onlyProblems">
                <i>⚠️</i><span data-i18n="只看问题">只看问题</span>
            </button>
        </div>

        <!-- 折叠预算：被吞掉的技术日志按类别计数（不丢信息，可展开） -->
        <div class="lh-budget" id="budget" hidden></div>

        <section class="lh-qr" id="qrBox" hidden>
            <img class="lh-qr-img" id="qrImg" alt="登录二维码">
            <div class="lh-qr-side">
                <div class="lh-qr-t" data-i18n="扫码登录 QQ">扫码登录 QQ</div>
                <div class="lh-qr-hint" id="qrHint"></div>
                <a class="lh-btn" id="qrWebui" target="_blank" rel="noopener" data-i18n="打开 NapCat WebUI">打开 NapCat WebUI</a>
                <div class="lh-qr-token" id="qrToken"></div>
            </div>
        </section>

        <section class="lh-prog" id="prog">
            <div class="pg-card" id="progPaint"></div>
            <div class="pg-card" id="progTts"></div>
        </section>

        <section class="lh-panel" id="svcPanel" hidden></section>

        <section class="lh-view" id="view">
            <div class="lh-empty" id="empty" data-i18n="选择左侧服务查看事件">选择左侧服务查看事件</div>
            <div class="lh-lines" id="lines"></div>
        </section>

        <!-- 原文抽屉：点一行才出现，不占常驻空间 -->
        <aside class="lh-drawer" id="drawer" hidden>
            <div class="lh-drawer-head">
                <span id="drawerTitle" data-i18n="原文">原文</span>
                <button type="button" class="lh-icon-btn" id="drawerClose" title="关闭">✕</button>
            </div>
            <pre class="lh-drawer-body" id="drawerRaw"></pre>
        </aside>

        <footer class="lh-foot">
            <span id="statLines">0 条事件</span>
            <span id="statBg">后台 0 行</span>
            <span id="statSize">—</span>
            <span id="statRate">—</span>
            <span class="lh-grow"></span>
            <span id="statErr" class="lh-err"></span>
        </footer>
    </main>
</div>
<div class="lh-toast" id="toast"></div>

<!-- 语言包与 i18n 运行时（先加载，保证渲染点可用） -->
<script src="locales/zh-CN.js"></script>
<script src="locales/en.js"></script>
<script src="js/i18n.js"></script>
<script src="js/logs.js?v=20261112a"></script>
<script src="js/view_panel.js?v=20261027a"></script>
<script src="js/logs_camera.js?v=20261027a"></script>
<script src="js/logs_catpaws.js?v=20261027a"></script>
<script src="js/logs_progress.js?v=20261112a"></script>
</body>
</html>
