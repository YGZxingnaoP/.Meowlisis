<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>球 → 卡片 Demo（对齐原轨道/配色 · 可配置）</title>
<style>
  :root{
    --pink-light:#FFF0F5; --pink-soft:#FFD1DC; --pink-main:#FFB6C1;
    --pink-deep:#FF69B4;  --pink-dark:#FF1493;
    --white:#FFFFFF; --white-soft:#FAFAFA;
    --text-main:#4A4A4A; --text-light:#888888;
    --shadow:rgba(255,182,193,.4); --shadow-deep:rgba(255,105,180,.3);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
    background:linear-gradient(135deg,var(--white-soft) 0%,var(--pink-light) 50%,var(--pink-soft) 100%);
    height:100vh;overflow:hidden;color:var(--text-main);
    /* 关键①：整页禁止选中文本（输入框单独放开） */
    -webkit-user-select:none;-moz-user-select:none;user-select:none;
  }
  input,textarea,select{-webkit-user-select:text;-moz-user-select:text;user-select:text}
  img{-webkit-user-drag:none;user-drag:none}

  .bg-stars{
    position:fixed;inset:0;pointer-events:none;opacity:.6;
    background-image:
      radial-gradient(circle at 20% 30%,var(--pink-main) 0%,transparent 1%),
      radial-gradient(circle at 80% 20%,var(--pink-soft) 0%,transparent 1.5%),
      radial-gradient(circle at 40% 70%,var(--pink-main) 0%,transparent 1%),
      radial-gradient(circle at 70% 80%,var(--pink-soft) 0%,transparent 1.2%);
    animation:twinkle 4s ease-in-out infinite alternate;
  }
  @keyframes twinkle{from{opacity:.4}to{opacity:.8}}

  .hud{position:fixed;left:26px;top:20px;z-index:60;max-width:420px}
  .hud h1{font-size:16px;color:var(--pink-dark);margin-bottom:6px}
  .hud p{font-size:12px;line-height:1.65;color:var(--text-light)}
  .hud b{color:var(--pink-deep)}

  /* ===== 轨道系统（对齐原 .orbit-system / .orbit-outer） ===== */
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .orbit-system{position:relative;width:1200px;height:640px;cursor:grab}
  .orbit-system:active{cursor:grabbing}
  .ring{
    position:absolute;left:50%;top:50%;width:960px;height:480px;margin:-240px 0 0 -480px;
    border-radius:50%;pointer-events:none;
    border:1px solid rgba(255,182,193,.5);
    box-shadow:0 0 40px rgba(255,182,193,.25), inset 0 0 40px rgba(255,182,193,.12);
    transition:opacity .35s ease;
  }
  .center-launcher{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:210px;height:210px;border-radius:50%;z-index:10;cursor:pointer;
    background:linear-gradient(145deg,var(--white),var(--pink-light));
    box-shadow:0 8px 32px var(--shadow),0 0 60px var(--shadow-deep);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
    transition:transform .35s cubic-bezier(.34,1.56,.64,1), opacity .35s ease, filter .35s ease;
  }
  .center-launcher:hover{transform:translate(-50%,-50%) scale(1.05)}
  .center-launcher img{width:112px;height:112px;border-radius:50%;object-fit:cover}
  .center-launcher .cl{font-size:15px;font-weight:600;color:var(--pink-deep)}
  .orbit-system.focusing .center-launcher{opacity:.2;filter:blur(1px)}
  .orbit-system.focusing .ring{opacity:.35}

  /* ===== 轨道卡片 ===== */
  .slot{
    position:absolute;left:50%;top:50%;width:104px;height:146px;
    margin:-73px 0 0 -52px;perspective:900px;will-change:transform;cursor:pointer;
  }
  .slot.anim{transition:transform .5s cubic-bezier(.34,1.56,.64,1), opacity .35s ease, filter .35s ease}
  .card{
    position:relative;width:100%;height:100%;transform-style:preserve-3d;
    -webkit-transform-style:preserve-3d;transition:transform .6s cubic-bezier(.34,1.56,.64,1);will-change:transform;
  }
  .card.flipped{transform:rotateY(180deg)}
  .face{
    position:absolute;inset:0;border-radius:14px;overflow:hidden;
    backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 6px 20px var(--shadow-deep);
  }
  .front{display:flex;flex-direction:column;background:rgba(255,255,255,.92);
    border:1px solid rgba(255,182,193,.9);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  .front .art{flex:1;display:flex;align-items:center;justify-content:center;font-size:34px;
    background:linear-gradient(160deg,var(--a),var(--b));position:relative}
  .front .art .rarity{position:absolute;left:6px;top:6px;font-size:9px;font-weight:700;color:#fff;
    padding:1px 7px;border-radius:999px;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.6)}
  .front .name{font-size:12px;font-weight:700;text-align:center;padding:5px 4px;color:var(--text-main);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .back{
    transform:rotateY(180deg);display:flex;align-items:center;justify-content:center;text-align:center;padding:8px;
    background:rgba(161,140,209,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.5);
    box-shadow:0 4px 18px rgba(161,140,209,.45), inset 0 0 16px rgba(255,255,255,.25);
  }
  .back .bn{color:#fff;font-size:13px;font-weight:700;line-height:1.3;text-shadow:0 2px 8px rgba(90,60,140,.4)}

  .slot::after{
    content:attr(data-tooltip);position:absolute;bottom:calc(100% + 10px);left:50%;
    transform:translateX(-50%) scale(0);padding:6px 14px;background:rgba(255,255,255,.95);
    color:var(--text-main);font-size:13px;border-radius:8px;white-space:nowrap;
    box-shadow:0 4px 12px rgba(0,0,0,.12);opacity:0;transition:all .2s ease;pointer-events:none;z-index:999;
  }
  .slot:hover::after{transform:translateX(-50%) scale(1);opacity:1}
  .slot.dim{filter:saturate(.5) blur(1px);pointer-events:none}   /* 变暗的轨道卡不可点，避免误触底层 */
  .slot.dim::after{display:none}

  /* ===== 子卡：更大 + 可点击（点击后放大成配置卡） ===== */
  .children{position:absolute;left:50%;top:50%;width:0;height:0;z-index:960;pointer-events:none}
  .sub{
    position:absolute;left:-52px;top:-72px;width:104px;height:144px;transform-origin:center center;
    opacity:0;transform:translate(0,-4px) scale(.2);pointer-events:none;cursor:pointer;
    transition:transform .5s cubic-bezier(.34,1.56,.64,1), opacity .35s ease;
  }
  .children.open .sub{opacity:1;pointer-events:auto}
  .sub .mini{
    width:100%;height:100%;border-radius:13px;overflow:hidden;display:flex;flex-direction:column;
    background:rgba(255,255,255,.94);border:1px solid rgba(255,182,193,.9);
    box-shadow:0 6px 16px var(--shadow-deep);
  }
  .sub .mini .art{flex:1;display:flex;align-items:center;justify-content:center;font-size:30px;
    background:linear-gradient(160deg,var(--a),var(--b))}
  .sub .mini .name{font-size:11.5px;font-weight:600;text-align:center;padding:5px 2px;color:var(--text-main);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* ===== 大配置卡（有配置界面的地方更大） ===== */
  .config-card{
    position:absolute;left:50%;top:50%;width:420px;max-height:78vh;z-index:1200;
    display:flex;flex-direction:column;border-radius:22px;overflow:hidden;
    background:rgba(255,255,255,.97);border:2px solid var(--pink-soft);
    box-shadow:0 24px 60px rgba(255,105,180,.35), 0 0 0 8px rgba(255,255,255,.35);
    opacity:0;pointer-events:none;transform:translate(-50%,-50%) scale(.9);
    transition:transform .5s cubic-bezier(.34,1.56,.64,1), opacity .3s ease;
  }
  .config-card.show{opacity:1;pointer-events:auto}
  .cfg-head{position:relative;display:flex;align-items:center;gap:12px;padding:16px 18px;color:#fff}
  .cfg-emoji{font-size:38px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.25))}
  .cfg-title{font-size:19px;font-weight:800;text-shadow:0 2px 8px rgba(0,0,0,.22)}
  .cfg-desc{font-size:12px;opacity:.9;margin-top:2px}
  .cfg-back{position:absolute;left:12px;top:12px;background:rgba(255,255,255,.28);color:#fff;border:1px solid rgba(255,255,255,.5);
    border-radius:999px;font-size:12px;padding:3px 12px;cursor:pointer}
  .cfg-body{padding:16px 18px 6px;overflow:auto}
  .fld{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
  .fld > span{font-size:12.5px;font-weight:600;color:var(--text-main)}
  .fld input[type=text],.fld input[type=number],.fld select,.fld textarea{
    width:100%;padding:9px 11px;border:1px solid var(--pink-main);border-radius:10px;font-size:13px;
    font-family:inherit;color:var(--text-main);background:#fff;transition:border-color .2s, box-shadow .2s;
  }
  .fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--pink-deep);
    box-shadow:0 0 0 3px var(--shadow)}
  .fld.inline{flex-direction:row;align-items:center;justify-content:space-between;
    background:var(--pink-light);border:1px solid var(--pink-soft);border-radius:12px;padding:10px 12px}
  .fld.inline input[type=checkbox]{width:20px;height:20px;accent-color:var(--pink-deep)}
  .cfg-foot{display:flex;gap:10px;justify-content:flex-end;padding:12px 18px 16px;border-top:1px solid var(--pink-soft)}
  .btn{border:none;border-radius:12px;font-size:14px;font-family:inherit;font-weight:600;padding:9px 22px;cursor:pointer;transition:transform .15s,box-shadow .2s}
  .btn:active{transform:scale(.96)}
  .btn.primary{background:linear-gradient(145deg,var(--pink-main),var(--pink-deep));color:#fff;box-shadow:0 6px 16px var(--shadow-deep)}
  .btn.ghost{background:var(--white);color:var(--pink-deep);border:1px solid var(--pink-main)}
</style>
</head>
<body>
  <div class="bg-stars"></div>

  <div class="hud">
    <h1>球 → 卡片 Demo（原轨道/配色 · 可配置）</h1>
    <p>
      拖动空白 = 转轨道（已禁止选中文本）；<b>点子卡/无子球的卡 = 放大成配置卡</b>；
      有子球的卡先摊开子卡，点子卡再放大配置；<b>返回/取消</b>可回到子卡层。
    </p>
  </div>

  <div class="stage" id="stage">
    <div class="orbit-system" id="orbitSystem">
      <div class="ring"></div>
      <div class="center-launcher" id="centerLauncher">
        <img src="MiaoWuFace.png" alt="启动">
        <div class="cl">启动</div>
      </div>
      <div class="children" id="children"></div>
    </div>
    <div class="config-card" id="configCard"></div>
  </div>

<script>
/* 13 张配置球卡；kids 为子卡；无 kids 的卡点击直接开配置 */
const CARDS = [
  { name:'基本',     emoji:'⚙️', a:'#9aa8ff', b:'#5a6bd6', rarity:'普通', tip:'基础与 app 设置',         kids:[] },
  { name:'角色卡',   emoji:'📇', a:'#ff9ec7', b:'#e0558f', rarity:'稀有', tip:'角色卡配置',             kids:[] },
  { name:'SenseVoice',emoji:'🎤', a:'#5fd6e6', b:'#2a8fa8', rarity:'稀有', tip:'语音识别配置',           kids:['识别','闭麦','音频'] },
  { name:'LLM',      emoji:'🧠', a:'#8f7bff', b:'#5a3ad6', rarity:'史诗', tip:'大语言模型配置',         kids:['模型','提示词','算法'] },
  { name:'主动回复', emoji:'💤', a:'#a98bff', b:'#6a3ad6', rarity:'稀有', tip:'角色主动回复配置',       kids:['配置','浏览'] },
  { name:'CatBrain', emoji:'🐾', a:'#b07bff', b:'#7a3ad6', rarity:'史诗', tip:'角色灵魂配置',           kids:['长期记忆','记忆摘要','原则词','价值观','用户记忆'] },
  { name:'数据库',   emoji:'🗄️', a:'#5cc8ff', b:'#2a7ad6', rarity:'稀有', tip:'数据库知识库配置',       kids:['搜索','知识','来源','预填'] },
  { name:'TTS',      emoji:'🎙️', a:'#2fd6d6', b:'#159aa8', rarity:'史诗', tip:'语音合成与 SoVITS 配置', kids:['模型','参数','配置','间隔'] },
  { name:'字幕',     emoji:'💬', a:'#5ce0c0', b:'#2aa88a', rarity:'普通', tip:'字幕模块配置',           kids:[] },
  { name:'VTS',      emoji:'🧍', a:'#ff7ec7', b:'#d63a8f', rarity:'稀有', tip:'VTuber / VTS 配置',       kids:['配置','表情','桌宠','参数'] },
  { name:'工具箱',   emoji:'🧰', a:'#ffc45c', b:'#d68a20', rarity:'史诗', tip:'工具箱（Minecraft 等）', kids:[] },
  { name:'歌曲',     emoji:'🎵', a:'#ff9d5c', b:'#d66a20', rarity:'史诗', tip:'点歌翻唱与感想配置',     kids:[] },
  { name:'待办',     emoji:'📅', a:'#7be08a', b:'#2aa84a', rarity:'普通', tip:'待办提醒',               kids:[] }
];

const TOTAL = CARDS.length;
const RX = 470, RY = 235;                              // 椭圆半径（原：圆 + scaleY(0.5)）
const PLANET_SCALE0 = 0.65, PLANET_SCALE_SPAN = 0.55;  // 原 scale 公式

const orbitSystem = document.getElementById('orbitSystem');
const childrenBox = document.getElementById('children');
const stage = document.getElementById('stage');
const configCard = document.getElementById('configCard');
const icons = ['🃏','✨','🔧','📦','⭐','🎯','🔖'];

let rotation = 0, velocity = 0, rafId = null, dragging = false;
let lastX = 0, suppressClick = false, seq = 0;
const state = { view:'orbit', card:null, parent:null };  // view: orbit | subs | config

/* ===== 建卡 ===== */
const slots = [];
CARDS.forEach((c, i) => {
  const slot = document.createElement('div');
  slot.className = 'slot';
  slot.dataset.tooltip = c.tip;
  const card = document.createElement('div');
  card.className = 'card';
  card.style.setProperty('--a', c.a);
  card.style.setProperty('--b', c.b);
  card.innerHTML = `
    <div class="face front">
      <div class="art"><span class="rarity">${c.rarity}</span>${c.emoji}</div>
      <div class="name">${c.name}</div>
    </div>
    <div class="face back"><span class="bn">${c.name}</span></div>`;
  slot.appendChild(card);
  orbitSystem.appendChild(slot);
  const baseAngle = (2 * Math.PI / TOTAL) * i - Math.PI / 2;
  slots.push({ slot, card, baseAngle, data: c });
});

/* ===== 椭圆布局（复刻原算法） ===== */
function applyRotation(rot) {
  rotation = rot;
  const dim = state.view !== 'orbit';
  slots.forEach((s, i) => {
    if (state.view === 'subs' && i === state.card) return;   // 拉出的父卡单独定位
    const a = s.baseAngle + rot * Math.PI / 180;
    const x = RX * Math.sin(a), y = RY * Math.cos(a);
    const depth = Math.cos(a);
    const sc = PLANET_SCALE0 + (depth + 1) / 2 * PLANET_SCALE_SPAN;
    s.slot.style.transform = `translate3d(${x.toFixed(1)}px, ${y.toFixed(1)}px, 0) scale(${sc.toFixed(3)})`;
    s.slot.style.zIndex = String(Math.round((depth + 1) * 50 + 5));
    s.slot.style.opacity = dim ? '0.12' : '1';
    s.slot.classList.toggle('dim', dim);
  });
}

/* ===== 拖动 + 惯性（复刻 bindDragRotation）===== */
function setAnim(on) { slots.forEach(s => s.slot.classList.toggle('anim', on)); }

function inertia() {
  rotation += velocity;
  velocity *= 0.92;
  applyRotation(rotation);
  if (Math.abs(velocity) < 0.05) { rafId = null; return; }
  rafId = requestAnimationFrame(inertia);
}

stage.addEventListener('mousedown', (e) => {
  if (state.view !== 'orbit') return;                 // 只在轨道视图拖动
  if (e.target.closest('input,textarea,select,button,.config-card')) return;
  dragging = true; lastX = e.clientX; setAnim(false);
  e.preventDefault();                                 // 关键①：阻止拖动时选中文本
});
document.addEventListener('mousemove', (e) => {
  if (!dragging || state.view !== 'orbit') return;
  const dx = e.clientX - lastX;
  velocity = dx * 0.35; lastX = e.clientX;
  rotation += dx * 0.3;
  applyRotation(rotation);
  if (Math.abs(dx) > 5) suppressClick = true;
});
document.addEventListener('mouseup', () => {
  if (!dragging) return;
  dragging = false;
  setTimeout(() => { suppressClick = false; }, 50);
  if (rafId !== null) cancelAnimationFrame(rafId);
  if (Math.abs(velocity) > 0.05) rafId = requestAnimationFrame(inertia);
  else rafId = null;
});

/* ===== 子卡（扇形摊开，点子卡放大配置）===== */
function buildSubs(list, theme) {
  childrenBox.innerHTML = '';
  const n = list.length, mid = (n - 1) / 2;
  list.forEach((name, i) => {
    const sub = document.createElement('div');
    sub.className = 'sub';
    sub.innerHTML = `<div class="mini" style="--a:${theme[0]};--b:${theme[1]}">
        <div class="art">${icons[i % icons.length]}</div>
        <div class="name">${name}</div>
      </div>`;
    sub.dataset.dx = ((i - mid) * 84).toFixed(1);
    sub.dataset.dy = (188 + Math.abs(i - mid) * 12).toFixed(1);
    sub.dataset.rot = ((i - mid) * 6).toFixed(1);
    sub.style.transform = 'translate(0,-4px) scale(.2)';   // 初始态：贴在父卡中心（缩小）
    sub.style.opacity = '0';
    sub.addEventListener('click', (e) => {
      e.stopPropagation();
      openConfig(name, theme[0], theme[1], icons[i % icons.length], sub, state.card);  // 子卡 → 放大配置
    });
    childrenBox.appendChild(sub);
  });
}
function openSubs(open) {
  childrenBox.classList.toggle('open', open);            // .open 只负责开/关 pointer-events
  const kids = [...childrenBox.children];
  if (open) {
    // 先落回父卡中心的"小卡"态，再下一帧扇形放大 → 保证从卡片放大而不是从左上角飞入
    kids.forEach(sub => { sub.style.opacity = '0'; sub.style.transform = 'translate(0,-4px) scale(.2)'; });
    void childrenBox.offsetWidth;                        // 强制重排，让初始态生效
    requestAnimationFrame(() => {
      kids.forEach((sub, i) => {
        sub.style.zIndex = String(960 + i);
        sub.style.opacity = '1';
        sub.style.transform = `translate(${sub.dataset.dx}px, ${sub.dataset.dy}px) rotate(${sub.dataset.rot}deg) scale(1)`;
      });
    });
  } else {
    kids.forEach(sub => { sub.style.opacity = '0'; sub.style.transform = 'translate(0,-4px) scale(.2)'; });
  }
}

/* ===== 大配置卡 ===== */
function fieldHtml(name) {
  return `
    <label class="fld"><span>名称</span><input type="text" value="${name} 配置项"></label>
    <label class="fld"><span>数值（0~1）</span><input type="number" value="0.7" step="0.1" min="0" max="1"></label>
    <label class="fld"><span>API Key</span><input type="text" placeholder="sk-..."></label>
    <label class="fld"><span>模型</span>
      <select><option>DeepSeek</option><option>阿里云 Qwen</option><option>Gemini</option></select></label>
    <label class="fld inline"><span>启用该功能</span><input type="checkbox" checked></label>
    <label class="fld"><span>提示词</span><textarea rows="3">你是喵呜，一只可爱的猫娘…</textarea></label>`;
}
function openConfig(title, a, b, emoji, fromEl, parentIdx) {
  // ★ 先量取来源位置：接下来会清空 childrenBox，fromEl 可能被移除，必须先取 rect
  let dx = 0, dy = 0;
  if (fromEl) {
    const r = fromEl.getBoundingClientRect();
    const sr = stage.getBoundingClientRect();
    if (r.width > 0 && r.height > 0) {
      dx = (r.left + r.width / 2) - (sr.left + sr.width / 2);
      dy = (r.top + r.height / 2) - (sr.top + sr.height / 2);
    }
  }

  state.view = 'config';
  state.parent = parentIdx;
  clearCardFocus();
  openSubs(false); childrenBox.innerHTML = '';
  orbitSystem.classList.add('focusing');
  setAnim(true); applyRotation(rotation);

  configCard.innerHTML = `
    <div class="cfg-head" style="background:linear-gradient(160deg,${a},${b})">
      ${parentIdx !== null ? '<button class="cfg-back" id="cfgBack">← 返回</button>' : ''}
      <span class="cfg-emoji">${emoji}</span>
      <div><div class="cfg-title">${title}</div><div class="cfg-desc">配置项（演示，随便填）</div></div>
    </div>
    <div class="cfg-body">${fieldHtml(title)}</div>
    <div class="cfg-foot">
      <button class="btn ghost" id="cfgCancel">取消</button>
      <button class="btn primary" id="cfgSave">保存</button>
    </div>`;

  // 入场：从来源卡片位置"放大"到中央
  configCard.style.transition = 'none';
  configCard.style.opacity = '0';
  configCard.style.transform = `translate(-50%,-50%) translate(${dx}px,${dy}px) scale(.25)`;
  configCard.classList.add('show');                      // ★ 关键：开启 pointer-events，否则点不到输入框
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      configCard.style.transition = '';
      configCard.style.opacity = '1';
      configCard.style.transform = 'translate(-50%,-50%) translate(0,0) scale(1)';
    });
  });

  document.getElementById('cfgSave').addEventListener('click', (e) => { e.stopPropagation(); toast('已保存（演示）'); closeConfig(); });
  document.getElementById('cfgCancel').addEventListener('click', (e) => { e.stopPropagation(); closeConfig(); });
  const back = document.getElementById('cfgBack');
  if (back) back.addEventListener('click', (e) => { e.stopPropagation(); const p = state.parent; hideConfig(); if (p !== null) showSubs(p); else clearAll(); });
}
configCard.addEventListener('mousedown', (e) => e.stopPropagation());
configCard.addEventListener('click', (e) => e.stopPropagation());

function hideConfig() { configCard.classList.remove('show'); configCard.style.opacity = '0'; }

function closeConfig() {
  hideConfig();
  if (state.parent !== null) showSubs(state.parent);   // 返回子卡层
  else clearAll();
}

/* ===== 视图切换 ===== */
function clearCardFocus() {
  if (state.card !== null) {
    const s = slots[state.card];
    s.card.classList.remove('flipped');
    s.slot.classList.remove('focus');
  }
  state.card = null;
  orbitSystem.classList.remove('focusing');
}
function showSubs(i) {
  const my = ++seq;
  clearCardFocus();
  hideConfig();
  state.view = 'subs'; state.card = i;
  orbitSystem.classList.add('focusing');
  setAnim(true); applyRotation(rotation);              // 其余卡片变暗
  const s = slots[i];
  s.slot.classList.add('focus'); s.slot.classList.remove('dim');
  s.slot.style.opacity = '1'; s.slot.style.zIndex = '900';
  s.slot.style.transform = 'translate3d(0,0,0) scale(1.62)';   // 父卡放大到中央
  buildSubs(s.data.kids, [s.data.a, s.data.b]);
  setTimeout(() => { if (my === seq) openSubs(true); }, 120);
}
function clearAll() {
  const my = ++seq;
  hideConfig();
  openSubs(false); childrenBox.innerHTML = '';
  clearCardFocus();
  state.view = 'orbit'; state.parent = null;
  setAnim(true); applyRotation(rotation);
  setTimeout(() => { if (my === seq) setAnim(false); }, 620);
}

/* ===== 事件 ===== */
slots.forEach((s, i) => {
  s.slot.addEventListener('click', (e) => {
    e.stopPropagation();
    if (suppressClick) return;
    if (state.view === 'subs' && state.card === i) { clearAll(); return; }
    if (s.data.kids.length) showSubs(i);
    else openConfig(s.data.name, s.data.a, s.data.b, s.data.emoji, s.slot, null);  // 无子球 → 直接配置
  });
});
document.getElementById('centerLauncher').addEventListener('click', (e) => { e.stopPropagation(); clearAll(); });
stage.addEventListener('click', (e) => {
  if (e.target.closest('.config-card')) return;
  if (state.view === 'orbit') return;
  clearAll();                                   // 点空白：整体收起
});

/* 轻量 toast */
let toastEl = null;
function toast(msg) {
  if (!toastEl) {
    toastEl = document.createElement('div');
    toastEl.style.cssText = 'position:fixed;left:50%;bottom:40px;transform:translateX(-50%) translateY(10px);' +
      'background:rgba(255,255,255,.96);color:#FF1493;font-size:14px;font-weight:600;padding:10px 22px;' +
      'border-radius:999px;box-shadow:0 8px 24px rgba(255,105,180,.35);opacity:0;transition:all .3s;z-index:2000';
    document.body.appendChild(toastEl);
  }
  toastEl.textContent = msg;
  requestAnimationFrame(() => { toastEl.style.opacity = '1'; toastEl.style.transform = 'translateX(-50%) translateY(0)'; });
  clearTimeout(toastEl._t);
  toastEl._t = setTimeout(() => { toastEl.style.opacity = '0'; toastEl.style.transform = 'translateX(-50%) translateY(10px)'; }, 1400);
}

/* ===== 初始布局 ===== */
setAnim(false);
applyRotation(0);
</script>
