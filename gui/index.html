<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>喵呜配置管理器</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/orbit.css">
    <link rel="stylesheet" href="css/modal.css">
</head>
<body>
    <div class="bg-stars"></div>
    <div class="container">
        <div class="orbit-system" id="orbitSystem">
            <!-- 中心启动球簇（含分裂出的服务启动球） -->
            <div class="launcher-cluster" id="launcherCluster">
                <div class="center-launcher" id="centerLauncher">
                    <div class="launcher-glow"></div>
                    <img src="MiaoWuFace.png" alt="启动" class="launcher-face">
                    <div class="launcher-label">启动</div>
                </div>
            </div>
            
            <!-- 外层配置轨道 -->
            <div class="orbit orbit-outer" id="orbitOuter">
                <div class="orbit-ring ring-outer"></div>
            </div>
        </div>
    </div>

    <!-- Config Modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-window" id="modalWindow">
            <div class="modal-header">
                <h3 id="modalTitle">配置</h3>
                <button class="modal-close" id="modalClose">&times;</button>
            </div>
            <div class="modal-body" id="modalBody">
                <!-- Dynamic content -->
            </div>
            <div class="modal-footer">
                <button class="btn btn-primary" id="modalSave">保存</button>
                <button class="btn btn-secondary" id="modalCancel">取消</button>
            </div>
        </div>
    </div>

    <!-- Status Toast -->
    <div class="toast" id="toast"></div>

    <script src="js/api.js"></script>
    <script src="js/config.js"></script>
    <script src="js/orbit.js"></script>
    <script src="js/modal.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
