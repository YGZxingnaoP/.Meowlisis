<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>喵呜配置管理器</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/orbit.css">
    <link rel="stylesheet" href="css/modal.css">
    <link rel="stylesheet" href="css/vts.css">
</head>
<body>
    <div class="bg-stars"></div>
    <div class="container">
        <div class="orbit-system" id="orbitSystem">
            <!-- 中心启动球簇（含分裂出的服务启动球） -->
            <div class="launcher-cluster" id="launcherCluster">
                <div class="center-launcher" id="centerLauncher">
                    <div class="launcher-glow"></div>
                    <img src="MiaoWuFace.png" alt="启动" class="launcher-face">
                    <div class="launcher-label">启动</div>
                </div>
            </div>
            
            <!-- 外层配置轨道 -->
            <div class="orbit orbit-outer" id="orbitOuter">
                <div class="orbit-ring ring-outer"></div>
            </div>
        </div>
    </div>

    <!-- Toolbox 子视图 -->
    <div class="toolbox-overlay" id="toolboxOverlay">
        <div class="toolbox-panel">
            <div class="toolbox-header">
                <h3>Toolbox 工具箱</h3>
                <button class="modal-close" id="toolboxClose">&times;</button>
            </div>
            <div class="toolbox-system" id="toolboxSystem">
                <!-- 中心父级模型球（独立，不随轨道压扁） -->
                <div class="toolbox-center-cluster">
                    <div class="toolbox-center" id="toolboxCenter">
                        <span class="toolbox-center-label">父级模型</span>
                    </div>
                </div>
                <!-- 椭圆轨道（立体倾斜） -->
                <div class="toolbox-orbit" id="toolboxOrbit">
                    <div class="toolbox-ring"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Config Modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-window" id="modalWindow">
            <div class="modal-header">
                <h3 id="modalTitle">配置</h3>
                <button class="modal-close" id="modalClose">&times;</button>
            </div>
            <div class="modal-body" id="modalBody">
                <!-- Dynamic content -->
            </div>
            <div class="modal-footer">
                <button class="btn btn-primary" id="modalSave">保存</button>
                <button class="btn btn-secondary" id="modalCancel">取消</button>
            </div>
        </div>
    </div>

    <!-- Status Toast -->
    <div class="toast" id="toast"></div>

    <script src="js/api.js"></script>
    <!-- 配置面板生成器（Config 对象，按功能域拆分） -->
    <script src="js/config/core.js"></script>
    <script src="js/config/basic.js"></script>
    <script src="js/config/llm.js"></script>
    <script src="js/config/tts.js"></script>
    <script src="js/config/media.js"></script>
    <script src="js/config/toolbox.js"></script>
    <script src="js/config/song.js"></script>
    <script src="js/config/db.js"></script>
    <script src="js/config/character.js"></script>
    <script src="js/orbit.js"></script>
    <script src="js/modal.js"></script>
    <!-- 应用控制器（App 对象，按功能域拆分） -->
    <script src="js/app/core.js"></script>
    <script src="js/app/tts.js"></script>
    <script src="js/app/llm.js"></script>
    <script src="js/app/audio.js"></script>
    <script src="js/app/toolbox.js"></script>
    <script src="js/app/song.js"></script>
    <script src="js/app/bind.js"></script>
</body>
</html>
