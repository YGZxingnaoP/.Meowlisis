<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MeowLLM 配置</title>
<!-- 主项目 GUI 的配色变量（--pink-* / --text-*） -->
<link rel="stylesheet" href="css/style.css?v=33">
<!-- 本页样式 -->
<link rel="stylesheet" href="meowllm/css/meowllm.css?v=1">
</head>
<body>

<!--
  这个文件只是壳：页面由 meowllm/js/ 下的模块装配。

    meowllm/js/schema.js   参数表（分组 / 字段 / 类型 / 默认值 / 说明）—— 唯一的数据源
    meowllm/js/api.js      /api/meowllm/config 与 /api/meowllm/control/* 的封装
    meowllm/js/fields.js   点号路径读写 + 单个字段的渲染 / 取值
    meowllm/js/panels.js   配置区与「状态与自检」区的装配
    meowllm/js/sidebar.js  侧边栏导航
    meowllm/js/app.js      加载 / 保存 / 脏状态 / 区切换

  加一个参数 = 只在 schema.js 里加一行，别的文件不用动。
  主项目配置页（gui/js/config/llm.js）跳转过来的地址就是 /meowllm.html。
-->
<div id="app" class="mll-shell">
  <aside class="mll-side" id="mllSide"></aside>

  <main class="mll-main">
    <header class="mll-head">
      <div>
        <h1>MeowLLM 配置</h1>
        <div class="mll-path" id="mllPath">读取中…</div>
      </div>
      <div class="mll-actions">
        <span id="mllStatus" class="mll-status"></span>
        <button type="button" class="ghost" id="mllReload">重新读取</button>
        <button type="button" id="mllSave">保存配置</button>
      </div>
    </header>

    <section class="mll-body" id="mllBody">
      <div class="mll-error-box"><b>加载中…</b></div>
    </section>
  </main>
</div>

<script src="meowllm/js/schema.js?v=1"></script>
<script src="meowllm/js/api.js?v=1"></script>
<script src="meowllm/js/fields.js?v=1"></script>
<script src="meowllm/js/panels.js?v=1"></script>
<script src="meowllm/js/sidebar.js?v=1"></script>
<script src="meowllm/js/app.js?v=1"></script>
</body>
</html>
